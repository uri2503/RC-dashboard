<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RC Dev Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:#0d0d0d;color:#e8e8e8;min-height:100vh;width:100%}
header{background:#141414;border-bottom:1px solid #2a2a2a;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:36px;height:36px;background:#c0392b;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
.logo-text{font-size:13px;font-weight:600;letter-spacing:.06em}
.logo-sub{font-size:10px;color:#888;margin-top:1px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:7px;border:none;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s}
.btn-red{background:#c0392b;color:#fff}
.btn-red:hover{background:#a93226}
.btn-gray{background:#1f1f1f;color:#aaa;border:1px solid #2a2a2a}
.btn-gray:hover{color:#e8e8e8}
.stats{display:flex;border-bottom:1px solid #2a2a2a;overflow-x:auto;max-width:100%}
.stat{padding:14px 24px;border-right:1px solid #2a2a2a;flex-shrink:0}
.stat-n{font-size:24px;font-weight:700;color:#c0392b;font-variant-numeric:tabular-nums}
.stat-l{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.toolbar{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid #2a2a2a;flex-wrap:wrap}
.fb{padding:5px 14px;border-radius:20px;border:1px solid #2a2a2a;background:transparent;color:#888;font-size:12px;cursor:pointer;font-family:inherit}
.fb.on{background:#c0392b;color:#fff;border-color:#c0392b}
.search{margin-left:auto;background:#1a1a1a;border:1px solid #2a2a2a;color:#e8e8e8;padding:6px 12px;border-radius:7px;font-family:inherit;font-size:13px;width:180px;outline:none}
.search:focus{border-color:#c0392b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:20px;width:100%;max-width:100%;overflow:hidden}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0;max-width:100%}
.card-top{padding:14px 16px 12px;border-bottom:1px solid #2a2a2a;display:flex;align-items:flex-start;gap:10px}
.card-icon{width:36px;height:36px;background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.card-name{font-size:14px;font-weight:600;line-height:1.3}
.card-tags{font-size:11px;color:#666;margin-top:2px}
.badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap;flex-shrink:0}
.s-live{background:rgba(39,174,96,.12);color:#27ae60}
.s-dev{background:rgba(243,156,18,.12);color:#f39c12}
.s-idee{background:rgba(136,136,136,.12);color:#888}
.s-archiv{background:rgba(41,128,185,.12);color:#2980b9}
.card-body{padding:12px 16px;flex:1}
.card-desc{font-size:12px;color:#888;line-height:1.6}
.pbar-row{display:flex;align-items:center;gap:8px;margin-top:12px}
.pbar{flex:1;height:4px;background:#2a2a2a;border-radius:2px;overflow:hidden}
.pfill{height:100%;background:#c0392b;border-radius:2px}
.ppct{font-size:11px;color:#c0392b;font-weight:600;min-width:30px;text-align:right}
.reqs{margin-top:12px}
.reqs-title{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#666;margin-bottom:6px}
.req-item{font-size:12px;color:#aaa;padding:2px 0;display:flex;gap:6px;line-height:1.4}
.req-item::before{content:'›';color:#c0392b;flex-shrink:0}
.cl-last{margin-top:10px;border-top:1px solid #222;padding-top:10px;font-size:11px;color:#666;line-height:1.5}
.cl-date{color:#c0392b;font-weight:500}
.card-foot{padding:10px 16px;border-top:1px solid #2a2a2a;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-link{font-size:12px;color:#c0392b;text-decoration:none}
.card-link:hover{text-decoration:underline}
.card-link.muted{color:#666}
.foot-btns{margin-left:auto;display:flex;gap:6px}
.btn-sm{padding:4px 10px;border-radius:6px;border:1px solid #2a2a2a;background:transparent;color:#aaa;font-size:12px;cursor:pointer;font-family:inherit}
.btn-sm:hover{color:#e8e8e8;border-color:#444}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:#666}
.empty p{margin-bottom:16px;font-size:14px}

/* OVERLAY */
.ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px}
.ov.open{display:flex}
.modal{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto}
.mhead{padding:18px 20px 14px;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#1a1a1a;z-index:1}
.mhead h2{font-size:15px;font-weight:600}
.mclose{background:none;border:none;color:#888;font-size:22px;cursor:pointer;line-height:1;padding:0}
.mbody{padding:18px 20px}
.mfoot{padding:14px 20px;border-top:1px solid #2a2a2a;display:flex;gap:8px;justify-content:flex-end}
.frow{margin-bottom:14px}
.frow label{display:block;font-size:11px;color:#888;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.frow input,.frow textarea,.frow select{width:100%;background:#0d0d0d;border:1px solid #2a2a2a;color:#e8e8e8;padding:8px 11px;border-radius:7px;font-family:inherit;font-size:13px;outline:none;resize:vertical}
.frow input:focus,.frow textarea:focus,.frow select:focus{border-color:#c0392b}
.frow select option{background:#1a1a1a}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.range-row{display:flex;align-items:center;gap:10px}
.range-row input[type=range]{flex:1;accent-color:#c0392b}
.range-v{font-size:13px;color:#c0392b;font-weight:600;min-width:36px;text-align:right}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{background:rgba(192,57,43,.12);border:1px solid rgba(192,57,43,.25);color:#ccc;font-size:11px;padding:3px 9px;border-radius:20px;display:flex;align-items:center;gap:4px}
.tag-x{cursor:pointer;color:#888;font-size:14px;line-height:1}
.tag-x:hover{color:#c0392b}

/* DETAIL */
.dsec{margin-bottom:20px}
.dsec h3{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#666;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #222}
.dreq{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;font-size:12px;padding:4px 0;color:#aaa}
.dreq-txt{display:flex;gap:6px;flex:1}
.dreq-txt::before{content:'›';color:#c0392b;flex-shrink:0}
.btn-done{padding:2px 8px;border-radius:5px;border:1px solid #333;background:transparent;color:#666;font-size:11px;cursor:pointer;font-family:inherit}
.btn-done:hover{color:#27ae60;border-color:#27ae60}
.add-row{display:flex;gap:8px;margin-top:8px}
.add-row input{flex:1;background:#0d0d0d;border:1px solid #2a2a2a;color:#e8e8e8;padding:7px 10px;border-radius:7px;font-family:inherit;font-size:12px;outline:none}
.add-row input:focus{border-color:#c0392b}
.cl-entry{display:flex;gap:8px;padding:3px 0;font-size:12px}
.cl-d{color:#c0392b;font-weight:500;flex-shrink:0;font-size:11px}
.cl-t{color:#aaa;line-height:1.5}
.btn-del{background:transparent;border:1px solid #4a1a16;color:#c0392b;padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
.btn-del:hover{background:rgba(192,57,43,.1)}

.toast{position:fixed;bottom:20px;right:20px;z-index:999;background:#1a1a1a;border:1px solid #2a2a2a;color:#e8e8e8;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.toast.show{opacity:1}
.toast.ok{border-left:3px solid #27ae60}
.toast.err{border-left:3px solid #c0392b}
@media(max-width:600px){.grid{padding:12px}.f2{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">RC</div>
    <div>
      <div class="logo-text">DEV DASHBOARD</div>
      <div class="logo-sub">...mit Liebe zum Detail</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn btn-gray" onclick="doExport()">↓ Export</button>
    <button class="btn btn-gray" onclick="doImport()">↑ Import</button>
    <button class="btn btn-red" onclick="openNew()">+ Neues Projekt</button>
  </div>
</header>

<div class="stats">
  <div class="stat"><div class="stat-n" id="sTotal">0</div><div class="stat-l">Gesamt</div></div>
  <div class="stat"><div class="stat-n" id="sLive">0</div><div class="stat-l">Live</div></div>
  <div class="stat"><div class="stat-n" id="sDev">0</div><div class="stat-l">In Entwicklung</div></div>
  <div class="stat"><div class="stat-n" id="sReq">0</div><div class="stat-l">Offene Anforderungen</div></div>
</div>

<div class="toolbar">
  <button class="fb on" onclick="setF('alle',this)">Alle</button>
  <button class="fb" onclick="setF('live',this)">Live</button>
  <button class="fb" onclick="setF('dev',this)">In Entwicklung</button>
  <button class="fb" onclick="setF('idee',this)">Idee</button>
  <button class="fb" onclick="setF('archiv',this)">Archiv</button>
  <input class="search" type="text" id="qSearch" placeholder="Suchen…" oninput="render()">
</div>

<div class="grid" id="grid"></div>
<div class="toast" id="toast"></div>

<!-- FORM MODAL -->
<div class="ov" id="ovForm" onclick="bgCloseForm(event)">
  <div class="modal">
    <div class="mhead"><h2 id="fTitle">Neues Projekt</h2><button class="mclose" onclick="closeForm()">×</button></div>
    <div class="mbody">
      <div class="f2">
        <div class="frow"><label>Name *</label><input id="fName" type="text" placeholder="RC_MeinTool"></div>
        <div class="frow"><label>Icon</label><input id="fIcon" type="text" placeholder="🔧" maxlength="4"></div>
      </div>
      <div class="frow"><label>Beschreibung</label><textarea id="fDesc" rows="2" placeholder="Was macht das Tool?"></textarea></div>
      <div class="f2">
        <div class="frow"><label>Status</label>
          <select id="fStatus">
            <option value="idee">💡 Idee</option>
            <option value="dev" selected>🔧 In Entwicklung</option>
            <option value="live">✅ Live</option>
            <option value="archiv">📦 Archiv</option>
          </select>
        </div>
        <div class="frow"><label>Fortschritt</label>
          <div class="range-row">
            <input type="range" id="fProg" min="0" max="100" value="0" oninput="document.getElementById('fProgV').textContent=this.value+'%'">
            <span class="range-v" id="fProgV">0%</span>
          </div>
        </div>
      </div>
      <div class="frow"><label>Live-URL</label><input id="fUrl" type="text" placeholder="https://uri2503.github.io/…"></div>
      <div class="frow"><label>Repo-URL</label><input id="fRepo" type="text" placeholder="https://github.com/uri2503/…"></div>
      <div class="frow"><label>Tags (Enter)</label>
        <div class="tag-list" id="fTagList"></div>
        <input id="fTagIn" type="text" placeholder="Tag eingeben + Enter" onkeydown="addTag(event)">
      </div>
    </div>
    <div class="mfoot">
      <button class="btn btn-gray" onclick="closeForm()">Abbrechen</button>
      <button class="btn btn-red" onclick="saveForm()">Speichern</button>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="ov" id="ovDetail" onclick="bgCloseDetail(event)">
  <div class="modal" style="max-width:600px">
    <div class="mhead"><h2 id="dTitle">Details</h2><button class="mclose" onclick="closeDetail()">×</button></div>
    <div class="mbody" id="dBody"></div>
    <div class="mfoot">
      <button class="btn-del" onclick="delProject()">Löschen</button>
      <div style="flex:1"></div>
      <button class="btn btn-gray" onclick="closeDetail()">Schließen</button>
      <button class="btn btn-red" onclick="editFromDetail()">✏ Bearbeiten</button>
    </div>
  </div>
</div>

<script>
var KEY = 'rcdash1';
var projects = [];
var filter = 'alle';
var editId = null;
var detailId = null;
var formTags = [];

function mkid() {
  return 'p' + Date.now() + Math.floor(Math.random()*9999);
}

function defaults() {
  var d = new Date().toISOString();
  return [
    {id:'p001',name:'RC_Unfallkalkulation',icon:'🚗',
     desc:'KI-gestütztes Schadenskalkulationstool mit Claude Vision API. Ersetzt Audatex/Autodata für kleinere Lackier- und Karosseriebetriebe. Vollständige KV-Erstellung mit PDF-Export.',
     status:'live',progress:90,
     url:'https://uri2503.github.io/RC_unfallkalkulation_demo',
     repo:'https://github.com/uri2503/RC_unfallkalkulation_demo',
     tags:['HTML','Vanilla JS','Supabase','Claude Vision'],
     requirements:['White-Label-Paket für Lackhersteller','Fahrzeugseiten-Erkennung verbessern','Mobile Optimierung iPad'],
     changelog:[{date:'2025-06',text:'KV PDF-Export + 8-stufiger Workflow'},{date:'2025-06',text:'Kennzahlen-Dashboard + Demo-Modus'}],
     created:d},
    {id:'p002',name:'Riedel Classic Doku',icon:'📋',
     desc:'Restaurationsdokumentationssystem mit Admin-Tool, Kundenportal und E-Mail-Templates. Canvas CI-Wasserzeichen, Drag-&-Drop Kapitel, zeitlimitierte Zugangscodes.',
     status:'live',progress:85,
     url:'https://uri2503.github.io/Riedel_Classic_Doku',
     repo:'https://github.com/uri2503/Riedel_Classic_Doku',
     tags:['HTML','Vanilla JS','Supabase'],
     requirements:['iOS/Safari File-Input stabilisieren','Supabase Auth-Flow verfeinern'],
     changelog:[{date:'2025-06',text:'Haupttool + Kundenportal live'},{date:'2025-06',text:'iOS Touch-Support Drag-&-Drop'}],
     created:d},
    {id:'p003',name:'Lingua Trainer',icon:'🗣',
     desc:'Persönlicher KI-Sprachtrainer für Englisch & Spanisch. Phrasen-Referenz, KI-Gesprächsmodus, Übungsmodul A1–C2.',
     status:'live',progress:80,
     url:'https://uri2503.github.io/Lingua_trainer',
     repo:'https://github.com/uri2503/Lingua_trainer',
     tags:['HTML','Vanilla JS','Claude API'],
     requirements:['Weitere Übungstypen ergänzen'],
     changelog:[{date:'2025-06',text:'Release mit Phrasen-, Gesprächs- und Übungsmodus'}],
     created:d},
    {id:'p004',name:'Ersatzteile Marktplatz',icon:'🔩',
     desc:'Klassiker-Ersatzteil-Marktplatz mit Kommissionsware-Support, Provisions-Regeln, Multi-Foto-Listings und Bildkarussell.',
     status:'dev',progress:65,
     url:'',repo:'https://github.com/uri2503',
     tags:['HTML','Vanilla JS','Supabase'],
     requirements:['Provisions-Export CSV/PDF','Käufer-Kommunikation','Zahlungsabwicklung klären'],
     changelog:[{date:'2025-06',text:'Basis-Listing mit Kommissionslogik'}],
     created:d},
    {id:'p005',name:'AutoAI Tools Landing',icon:'🌐',
     desc:'Landingpage für KFZ-AI-Tool-Portfolio. Werkstatt-Chatbot, Fahrzeugbewertung und Inserate-Generator als SaaS für DE/AT/CH.',
     status:'dev',progress:50,
     url:'',repo:'https://github.com/uri2503',
     tags:['HTML','GitHub Pages','Claude API'],
     requirements:['Deployment-URL bestätigen','Pricing-Sektion','SEO KFZ-Branche'],
     changelog:[{date:'2025-06',text:'Prototyp Chatbot, Bewertungstool, Anzeigen-Generator'}],
     created:d},
    {id:'p006',name:'RestoDocs SaaS',icon:'🏗',
     desc:'Multi-Tenant SaaS-Plattform für KFZ-Restaurationsbetriebe (DE/AT/CH). Supabase Multi-Tenant-Architektur.',
     status:'idee',progress:15,
     url:'',repo:'',
     tags:['SaaS','Supabase','Multi-Tenant'],
     requirements:['Multi-Tenant Architektur','Row Level Security','Onboarding-Flow','Abrechnungsmodell'],
     changelog:[{date:'2025-06',text:'Konzeptphase gestartet'}],
     created:d}
  ];
}

function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k,v) { try { localStorage.setItem(k,v); } catch(e) {} }

function load() {
  var raw = lsGet(KEY);
  if (raw) {
    try {
      var p = JSON.parse(raw);
      if (Array.isArray(p) && p.length > 0) { projects = p; return; }
    } catch(e) {}
  }
  projects = defaults();
  save();
}

function save() { lsSet(KEY, JSON.stringify(projects)); }

function statusLabel(s) {
  if (s === 'live')   return '✅ Live';
  if (s === 'dev')    return '🔧 In Entwicklung';
  if (s === 'idee')   return '💡 Idee';
  if (s === 'archiv') return '📦 Archiv';
  return s;
}

function renderStats() {
  document.getElementById('sTotal').textContent = projects.length;
  document.getElementById('sLive').textContent = projects.filter(function(p){return p.status==='live';}).length;
  document.getElementById('sDev').textContent = projects.filter(function(p){return p.status==='dev';}).length;
  var reqs = 0;
  for (var i=0;i<projects.length;i++) { reqs += (projects[i].requirements||[]).length; }
  document.getElementById('sReq').textContent = reqs;
}

function setF(f, btn) {
  filter = f;
  var btns = document.querySelectorAll('.fb');
  for (var i=0;i<btns.length;i++) btns[i].classList.remove('on');
  btn.classList.add('on');
  render();
}

function render() {
  renderStats();
  var q = document.getElementById('qSearch').value.toLowerCase();
  var list = [];
  for (var i=0;i<projects.length;i++) {
    var p = projects[i];
    var mf = filter === 'alle' || p.status === filter;
    var ms = !q || p.name.toLowerCase().indexOf(q)>=0 || (p.desc||'').toLowerCase().indexOf(q)>=0;
    if (mf && ms) list.push(p);
  }
  var g = document.getElementById('grid');
  if (!list.length) {
    g.innerHTML = '<div class="empty"><p>Keine Projekte gefunden.</p><button class="btn btn-red" onclick="openNew()">+ Projekt anlegen</button></div>';
    return;
  }
  var html = '';
  for (var i=0;i<list.length;i++) html += cardHTML(list[i]);
  g.innerHTML = html;
}

function cardHTML(p) {
  var req = p.requirements || [];
  var cl  = p.changelog    || [];
  var reqHtml = '';
  if (req.length) {
    reqHtml = '<div class="reqs"><div class="reqs-title">Offene Anforderungen (' + req.length + ')</div>';
    var show = req.length > 2 ? req.slice(0,2) : req;
    for (var i=0;i<show.length;i++) reqHtml += '<div class="req-item">' + show[i] + '</div>';
    if (req.length > 2) reqHtml += '<div style="font-size:11px;color:#666;margin-top:4px;cursor:pointer" onclick="openDetail(\'' + p.id + '\')">+' + (req.length-2) + ' weitere…</div>';
    reqHtml += '</div>';
  }
  var clHtml = '';
  if (cl.length) {
    var last = cl[cl.length-1];
    clHtml = '<div class="cl-last"><span class="cl-date">' + last.date + '</span> — ' + last.text + '</div>';
  }
  var links = '';
  if (p.url)  links += '<a class="card-link" href="' + p.url + '" target="_blank">↗ Live</a>';
  if (p.repo) links += '<a class="card-link muted" href="' + p.repo + '" target="_blank" style="margin-left:10px">⌥ Repo</a>';
  return '<div class="card">' +
    '<div class="card-top">' +
      '<div class="card-icon">' + (p.icon||'🔧') + '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="card-name">' + p.name + '</div>' +
        '<div class="card-tags">' + (p.tags||[]).slice(0,3).join(' · ') + '</div>' +
      '</div>' +
      '<span class="badge s-' + p.status + '">' + statusLabel(p.status) + '</span>' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-desc">' + (p.desc||'') + '</div>' +
      '<div class="pbar-row"><div class="pbar"><div class="pfill" style="width:' + (p.progress||0) + '%"></div></div><div class="ppct">' + (p.progress||0) + '%</div></div>' +
      reqHtml + clHtml +
    '</div>' +
    '<div class="card-foot">' + links +
      '<div class="foot-btns">' +
        '<button class="btn-sm" onclick="openDetail(\'' + p.id + '\')">Details</button>' +
        '<button class="btn-sm" onclick="openEdit(\'' + p.id + '\')">✏</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// FORM
function openNew() {
  editId = null; formTags = [];
  document.getElementById('fTitle').textContent = 'Neues Projekt';
  document.getElementById('fName').value = '';
  document.getElementById('fIcon').value = '';
  document.getElementById('fDesc').value = '';
  document.getElementById('fUrl').value = '';
  document.getElementById('fRepo').value = '';
  document.getElementById('fStatus').value = 'dev';
  document.getElementById('fProg').value = 0;
  document.getElementById('fProgV').textContent = '0%';
  renderTags();
  document.getElementById('ovForm').classList.add('open');
}
function openEdit(id) {
  var p = null;
  for (var i=0;i<projects.length;i++) if (projects[i].id===id) { p=projects[i]; break; }
  if (!p) return;
  editId = id; formTags = (p.tags||[]).slice();
  document.getElementById('fTitle').textContent = 'Bearbeiten';
  document.getElementById('fName').value = p.name||'';
  document.getElementById('fIcon').value = p.icon||'';
  document.getElementById('fDesc').value = p.desc||'';
  document.getElementById('fUrl').value = p.url||'';
  document.getElementById('fRepo').value = p.repo||'';
  document.getElementById('fStatus').value = p.status||'dev';
  document.getElementById('fProg').value = p.progress||0;
  document.getElementById('fProgV').textContent = (p.progress||0) + '%';
  renderTags();
  document.getElementById('ovForm').classList.add('open');
}
function closeForm() { document.getElementById('ovForm').classList.remove('open'); }
function bgCloseForm(e) { if (e.target.id==='ovForm') closeForm(); }
function addTag(e) {
  if (e.key !== 'Enter') return;
  var v = e.target.value.trim();
  if (v && formTags.indexOf(v)<0) { formTags.push(v); renderTags(); }
  e.target.value = '';
}
function removeTag(t) { formTags = formTags.filter(function(x){return x!==t;}); renderTags(); }
function renderTags() {
  var html = '';
  for (var i=0;i<formTags.length;i++) {
    html += '<span class="tag">' + formTags[i] + '<span class="tag-x" onclick="removeTag(\'' + formTags[i] + '\')">×</span></span>';
  }
  document.getElementById('fTagList').innerHTML = html;
}
function saveForm() {
  var name = document.getElementById('fName').value.trim();
  if (!name) { toast('Name ist erforderlich.','err'); return; }
  var data = {
    name: name,
    icon: document.getElementById('fIcon').value.trim() || '🔧',
    desc: document.getElementById('fDesc').value.trim(),
    status: document.getElementById('fStatus').value,
    progress: parseInt(document.getElementById('fProg').value) || 0,
    url: document.getElementById('fUrl').value.trim(),
    repo: document.getElementById('fRepo').value.trim(),
    tags: formTags.slice()
  };
  if (editId) {
    for (var i=0;i<projects.length;i++) {
      if (projects[i].id===editId) {
        projects[i].name=data.name; projects[i].icon=data.icon; projects[i].desc=data.desc;
        projects[i].status=data.status; projects[i].progress=data.progress;
        projects[i].url=data.url; projects[i].repo=data.repo; projects[i].tags=data.tags;
        break;
      }
    }
    toast('Gespeichert ✓','ok');
  } else {
    data.id = mkid(); data.requirements = []; data.changelog = [];
    data.created = new Date().toISOString();
    projects.unshift(data);
    toast('Projekt angelegt ✓','ok');
  }
  save(); closeForm(); render();
}

// DETAIL
function openDetail(id) {
  var p = null;
  for (var i=0;i<projects.length;i++) if (projects[i].id===id) { p=projects[i]; break; }
  if (!p) return;
  detailId = id;
  document.getElementById('dTitle').textContent = (p.icon||'🔧') + ' ' + p.name;
  var req = p.requirements||[];
  var cl  = p.changelog||[];
  var reqRows = '';
  for (var i=0;i<req.length;i++) {
    reqRows += '<div class="dreq"><span class="dreq-txt">' + req[i] + '</span><button class="btn-done" onclick="doneReq(' + i + ')">✓ Erledigt</button></div>';
  }
  if (!reqRows) reqRows = '<p style="font-size:12px;color:#666">Keine offenen Anforderungen.</p>';
  var clRows = '';
  for (var i=cl.length-1;i>=0;i--) {
    clRows += '<div class="cl-entry"><span class="cl-d">' + cl[i].date + '</span><span class="cl-t">' + cl[i].text + '</span></div>';
  }
  if (!clRows) clRows = '<p style="font-size:12px;color:#666">Noch kein Eintrag.</p>';
  var links = '';
  if (p.url)  links += '<a class="card-link" href="' + p.url + '" target="_blank">↗ Live-Demo öffnen</a> ';
  if (p.repo) links += '<a class="card-link muted" href="' + p.repo + '" target="_blank">⌥ GitHub Repo</a>';
  document.getElementById('dBody').innerHTML =
    '<div class="dsec"><h3>Übersicht</h3>' +
      '<p style="font-size:12px;color:#888;line-height:1.6;margin-bottom:12px">' + (p.desc||'') + '</p>' +
      '<div class="pbar-row"><div class="pbar"><div class="pfill" style="width:' + (p.progress||0) + '%"></div></div><div class="ppct">' + (p.progress||0) + '%</div></div>' +
      '<div style="margin-top:10px">' + links + '</div>' +
    '</div>' +
    '<div class="dsec"><h3>Offene Anforderungen (' + req.length + ')</h3>' +
      reqRows +
      '<div class="add-row"><input id="newReq" type="text" placeholder="Neue Anforderung…" onkeydown="if(event.key===\'Enter\')addReq()"><button class="btn-sm" onclick="addReq()">+ Hinzufügen</button></div>' +
    '</div>' +
    '<div class="dsec"><h3>Changelog (' + cl.length + ')</h3>' +
      clRows +
      '<div class="add-row"><input id="newCl" type="text" placeholder="Neuer Eintrag…" onkeydown="if(event.key===\'Enter\')addCl()"><button class="btn-sm" onclick="addCl()">+ Eintrag</button></div>' +
    '</div>';
  document.getElementById('ovDetail').classList.add('open');
}
function closeDetail() { document.getElementById('ovDetail').classList.remove('open'); }
function bgCloseDetail(e) { if (e.target.id==='ovDetail') closeDetail(); }
function editFromDetail() { closeDetail(); openEdit(detailId); }
function delProject() {
  if (!confirm('Projekt wirklich löschen?')) return;
  projects = projects.filter(function(p){return p.id!==detailId;});
  save(); closeDetail(); render(); toast('Gelöscht.','err');
}
function doneReq(i) {
  for (var j=0;j<projects.length;j++) {
    if (projects[j].id===detailId) { projects[j].requirements.splice(i,1); break; }
  }
  save(); render(); openDetail(detailId);
}
function addReq() {
  var v = document.getElementById('newReq').value.trim();
  if (!v) return;
  for (var i=0;i<projects.length;i++) {
    if (projects[i].id===detailId) { projects[i].requirements.push(v); break; }
  }
  save(); render();
  document.getElementById('newReq').value = '';
  openDetail(detailId);
}
function addCl() {
  var v = document.getElementById('newCl').value.trim();
  if (!v) return;
  var now = new Date();
  var d = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  for (var i=0;i<projects.length;i++) {
    if (projects[i].id===detailId) { projects[i].changelog.push({date:d,text:v}); break; }
  }
  save(); render();
  document.getElementById('newCl').value = '';
  openDetail(detailId);
}

// EXPORT / IMPORT
function doExport() {
  var blob = new Blob([JSON.stringify(projects,null,2)],{type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rc_dashboard.json';
  a.click();
  toast('Export erfolgreich ✓','ok');
}
function doImport() {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = function(e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(ev) {
      try {
        var d = JSON.parse(ev.target.result);
        if (!Array.isArray(d)) throw new Error();
        projects = d; save(); render(); toast('Import erfolgreich ✓','ok');
      } catch(e) { toast('Ungültige Datei.','err'); }
    };
    r.readAsText(f);
  };
  inp.click();
}

// TOAST
function toast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type||'ok');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

// INIT - wrapped in DOMContentLoaded for Safari compatibility
function init() {
  load();
  render();
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
